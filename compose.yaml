services:
  postgres:
    image: postgres:17-alpine
    container_name: hayvancikabilir-postgres

    environment:
      POSTGRES_DB: hayvancikabilir
      POSTGRES_USER: hayvan_app
      POSTGRES_PASSWORD: dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayvan_app -d hayvancikabilir"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: